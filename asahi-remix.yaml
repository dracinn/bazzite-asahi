# Apple Silicon enablement inherited from Fedora Asahi Remix.
# Keep this layer aligned with the upstream Fedora Asahi image definitions.

packages:
  - alsa-ucm-asahi
  - asahi-platform-metapackage
  - asahi-repos
  - fedora-asahi-remix-scripts
  - tiny-dfr
  - grub2-efi-aa64-modules
  - uboot-images-armv8
  - asahi-fwupdate
  - dracut-asahi
  - update-m1n1
  - aajohan-comfortaa-fonts

postprocess:
  - |
    #!/usr/bin/bash
    set -xeuo pipefail

    # U-Boot boots EFI/BOOT/BOOTAA64.EFI. Fedora's GRUB normally lives under
    # EFI/fedora, so mirror grubaa64.efi into EFI/BOOT for the Asahi path.
    target_efi="$(find /usr/lib/efi/grub2 -type d -path '*/EFI' -print -quit)"
    [[ -n "${target_efi}" ]] || { echo "GRUB EFI staging directory not found"; exit 1; }

    source_grub=""
    if [[ -f /boot/efi/EFI/fedora/grubaa64.efi ]]; then
        source_grub=/boot/efi/EFI/fedora/grubaa64.efi
    else
        source_grub="$(find /usr/lib/efi/grub2 -type f -path '*/EFI/fedora/grubaa64.efi' -print -quit)"
    fi

    [[ -n "${source_grub}" && -f "${source_grub}" ]] || {
        echo "grubaa64.efi not found in the composed EFI payload"
        exit 1
    }

    install -dm0755 "${target_efi}/BOOT"
    cp -a "${source_grub}" "${target_efi}/BOOT/grubaa64.efi"

repos:
  - fedora-asahi-remix-hotfixes
  - copr:copr.fedorainfracloud.org:group_asahi:fedora-remix-branding
  - copr:copr.fedorainfracloud.org:group_asahi:fedora-remix-scripts
  - copr:copr.fedorainfracloud.org:group_asahi:kernel
  - copr:copr.fedorainfracloud.org:group_asahi:mesa
  - copr:copr.fedorainfracloud.org:group_asahi:u-boot
